# Perfil de produção \u2014 variáveis obrigatórias
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT \u2014 segredo obrigatório em produção
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Flyway
spring.flyway.placeholders.admin_password_bcrypt=${ADMIN_PASSWORD_BCRYPT}

# CORS \u2014 origens autorizadas obrigatórias
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Porta fornecida pela plataforma ou padrão
server.port=${PORT:8080}