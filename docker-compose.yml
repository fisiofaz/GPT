services:
  postgres:
    image: postgres:16-alpine
    container_name: db_gpt
    restart: always
    environment:
      POSTGRES_DB: gpt_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - gpt_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_gpt
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - gpt_pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network

volumes:
  gpt_postgres_data:
  gpt_pgadmin_data:

networks:
  app-network:
    driver: bridge